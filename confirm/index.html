<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Confirm your tour</title>
<style>
  :root { --bg: #f6f1e7; --card: #fffdf8; --ink: #1d1d1b; --soft: #6b675f; --line: rgba(0,0,0,.1); --yes: #2e7d32; --no: #c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151514; --card: #22211f; --ink: #f2efe8; --soft: #a7a298; --line: rgba(255,255,255,.12); --yes: #5cbf63; --no: #ef6a6a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 460px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 28px) 16px 40px; }
  .from { color: var(--soft); font-size: 14px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
  h1 { font-size: 28px; line-height: 1.15; margin: 6px 0 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; margin-bottom: 18px; }
  .tour { font-size: 21px; font-weight: 800; margin-bottom: 8px; }
  .row { display: flex; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row b { min-width: 92px; color: var(--soft); font-weight: 600; }
  .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -1px; margin-right: 6px; }
  button { font: inherit; border: 0; border-radius: 999px; width: 100%; min-height: 56px; font-weight: 800; font-size: 18px; cursor: pointer; margin-bottom: 10px; }
  .yes { background: var(--yes); color: #fff; }
  .no { background: transparent; color: var(--no); border: 2px solid var(--no); }
  .small { background: transparent; color: var(--soft); min-height: 44px; font-size: 15px; font-weight: 600; text-decoration: underline; }
  textarea { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--card); color: var(--ink); margin-bottom: 14px; min-height: 70px; }
  label { display: block; font-size: 14px; color: var(--soft); margin-bottom: 6px; }
  .done { text-align: center; padding: 26px 18px; }
  .done .big { font-size: 54px; line-height: 1; }
  .done.is-yes .big { color: var(--yes); } .done.is-no .big { color: var(--no); }
  .muted { color: var(--soft); font-size: 15px; }
  .error { color: var(--no); font-weight: 600; }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script type="module" src="confirm.js"></script>
</body>
</html>
