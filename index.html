<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the app use the whole iPhone screen; the CSS keeps content clear of the notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d5c57">
  <title>Tour Docs</title>

  <!-- Installing on the phone: the icon, the name under it, and full screen without Safari's bars -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tour Docs">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Everything you see is drawn into this one box by js/app.js -->
  <div id="app"></div>
  <noscript>Tour Docs needs JavaScript to run.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
