<!doctype html>
<html lang="en" style="background: #f3efe6">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the app use the whole iPhone screen; the CSS keeps content clear of the notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Tour Docs has no dark theme: without this, a phone set to Dark Mode paints its own default dark
       background for the instant before styles.css has loaded, which looks like a flash of black. -->
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#1d5c57">
  <title>Tour Docs</title>

  <!-- Installing on the phone: the icon, the name under it, and full screen without Safari's bars -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tour Docs">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="styles.css">

  <!-- Hints the browser to start fetching every script straight away, all at once, instead of discovering
       them one file at a time as it reads each file's own imports. The app has grown to over two dozen
       small files (no build step bundles them into one), so this cuts a real chunk off the time before
       the app appears. Keep this list the same as FILES in sw.js. -->
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/auth.js">
  <link rel="modulepreload" href="js/backup.js">
  <link rel="modulepreload" href="js/changes.js">
  <link rel="modulepreload" href="js/db.js">
  <link rel="modulepreload" href="js/dom.js">
  <link rel="modulepreload" href="js/export.js">
  <link rel="modulepreload" href="js/gate.js">
  <link rel="modulepreload" href="js/ids.js">
  <link rel="modulepreload" href="js/journal.js">
  <link rel="modulepreload" href="js/loader.js">
  <link rel="modulepreload" href="js/passcode-config.js">
  <link rel="modulepreload" href="js/pdf.js">
  <link rel="modulepreload" href="js/rollcall.js">
  <link rel="modulepreload" href="js/rules.js">
  <link rel="modulepreload" href="js/supabase-config.js">
  <link rel="modulepreload" href="js/sync.js">
  <link rel="modulepreload" href="js/time.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/users.js">
  <link rel="modulepreload" href="js/version.js">
  <link rel="modulepreload" href="js/xlsx.js">
  <link rel="modulepreload" href="js/views/chrome.js">
  <link rel="modulepreload" href="js/views/destination.js">
  <link rel="modulepreload" href="js/views/guest.js">
  <link rel="modulepreload" href="js/views/journal.js">
  <link rel="modulepreload" href="js/views/move.js">
  <link rel="modulepreload" href="js/views/passcode.js">
  <link rel="modulepreload" href="js/views/rollcall.js">
  <link rel="modulepreload" href="js/views/settingsBackup.js">
  <link rel="modulepreload" href="js/views/settingsDestinations.js">
  <link rel="modulepreload" href="js/views/settingsExports.js">
  <link rel="modulepreload" href="js/views/settingsGuests.js">
  <link rel="modulepreload" href="js/views/settingsParties.js">
  <link rel="modulepreload" href="js/views/settingsWarnings.js">
  <link rel="modulepreload" href="js/views/trip.js">
  <link rel="modulepreload" href="js/views/trips.js">
  <link rel="modulepreload" href="js/views/undo.js">
  <link rel="modulepreload" href="js/views/welcome.js">
</head>
<body>
  <!-- Everything you see is drawn into this one box by js/app.js, which replaces this placeholder the
       moment it is ready. Without it, the phone shows nothing (just the plain background) for the second
       or two it takes to start: this keeps something on screen the whole time. -->
  <div id="app">
    <div class="boot-splash">
      <div class="boot-name">Tour Docs</div>
      <div class="boot-bar" aria-hidden="true"><div class="boot-bar-fill"></div></div>
    </div>
  </div>
  <noscript>Tour Docs needs JavaScript to run.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
